<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff3ddc"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>
    </marker>
  </defs>

  <rect width="1200" height="880" rx="24" fill="#0b0d19"/>

  <text x="600" y="50" font-size="24" font-weight="700" fill="#eef1ff" text-anchor="middle">One question through the docs-rag folder tree</text>

  <!-- Offline region -->
  <rect x="30" y="78" width="1140" height="186" rx="16" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
  <text x="50" y="106" font-size="16" font-weight="600" fill="#22d3ee" letter-spacing="1">OFFLINE  python scripts/ingest.py  (run when content changes)</text>

  <rect x="45" y="128" width="190" height="104" rx="14" fill="#11142a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="140" y="162" font-size="15" fill="#9ba3c4" text-anchor="middle">scripts/</text>
  <text x="140" y="188" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">ingest.py</text>
  <text x="140" y="214" font-size="15" fill="#9ba3c4" text-anchor="middle">wires the steps</text>

  <rect x="265" y="128" width="190" height="104" rx="14" fill="#11142a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="360" y="162" font-size="15" fill="#9ba3c4" text-anchor="middle">ingestion/</text>
  <text x="360" y="188" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">loaders.py</text>
  <text x="360" y="214" font-size="15" fill="#9ba3c4" text-anchor="middle">load() to Document</text>

  <rect x="485" y="128" width="190" height="104" rx="14" fill="#11142a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="580" y="162" font-size="15" fill="#9ba3c4" text-anchor="middle">ingestion/</text>
  <text x="580" y="188" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">chunking.py</text>
  <text x="580" y="214" font-size="15" fill="#9ba3c4" text-anchor="middle">split_documents()</text>

  <rect x="705" y="128" width="190" height="104" rx="14" fill="#11142a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="800" y="162" font-size="15" fill="#9ba3c4" text-anchor="middle">indexing/</text>
  <text x="800" y="188" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">embeddings.py</text>
  <text x="800" y="214" font-size="15" fill="#9ba3c4" text-anchor="middle">embed_documents()</text>

  <rect x="925" y="128" width="190" height="104" rx="14" fill="#11142a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1020" y="162" font-size="15" fill="#9ba3c4" text-anchor="middle">indexing/</text>
  <text x="1020" y="188" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">vectorstore.py</text>
  <text x="1020" y="214" font-size="15" fill="#9ba3c4" text-anchor="middle">add_documents(ids)</text>

  <line x1="235" y1="180" x2="265" y2="180" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="455" y1="180" x2="485" y2="180" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="675" y1="180" x2="705" y2="180" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="895" y1="180" x2="925" y2="180" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- persisted index link -->
  <line x1="1020" y1="232" x2="1020" y2="330" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-cyan)"/>
  <text x="1006" y="292" font-size="15" fill="#9ba3c4" text-anchor="end">storage/chroma/  (persisted on disk)</text>

  <!-- Online label -->
  <text x="80" y="316" font-size="16" font-weight="600" fill="#a78bfa" letter-spacing="1">ONLINE  every request</text>

  <!-- Row A -->
  <rect x="80" y="330" width="200" height="90" rx="14" fill="#11142a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="180" y="362" font-size="15" fill="#9ba3c4" text-anchor="middle">api/</text>
  <text x="180" y="386" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">main.py</text>
  <text x="180" y="410" font-size="15" fill="#9ba3c4" text-anchor="middle">POST /ask</text>

  <rect x="360" y="330" width="200" height="90" rx="14" fill="#11142a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="460" y="362" font-size="15" fill="#9ba3c4" text-anchor="middle">generation/</text>
  <text x="460" y="386" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">chain.py</text>
  <text x="460" y="410" font-size="15" fill="#9ba3c4" text-anchor="middle">rag_chain.invoke()</text>

  <rect x="640" y="330" width="200" height="90" rx="14" fill="#11142a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="740" y="362" font-size="15" fill="#9ba3c4" text-anchor="middle">retrieval/</text>
  <text x="740" y="386" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">retriever.py</text>
  <text x="740" y="410" font-size="15" fill="#9ba3c4" text-anchor="middle">top-k Documents</text>

  <rect x="920" y="330" width="200" height="90" rx="14" fill="#11142a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1020" y="362" font-size="15" fill="#9ba3c4" text-anchor="middle">indexing/</text>
  <text x="1020" y="386" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">vectorstore.py</text>
  <text x="1020" y="410" font-size="15" fill="#9ba3c4" text-anchor="middle">similarity_search()</text>

  <!-- forward arrows row A -->
  <line x1="280" y1="352" x2="360" y2="352" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <line x1="560" y1="352" x2="640" y2="352" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <line x1="840" y1="352" x2="920" y2="352" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <!-- return arrows row A -->
  <line x1="920" y1="398" x2="840" y2="398" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="640" y1="398" x2="560" y2="398" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="360" y1="398" x2="280" y2="398" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- step badges row A -->
  <circle cx="320" cy="334" r="12" fill="#f0b429"/>
  <text x="320" y="339" font-size="15" font-weight="700" fill="#0b0d19" text-anchor="middle">1</text>
  <circle cx="600" cy="334" r="12" fill="#f0b429"/>
  <text x="600" y="339" font-size="15" font-weight="700" fill="#0b0d19" text-anchor="middle">2</text>
  <circle cx="880" cy="334" r="12" fill="#f0b429"/>
  <text x="880" y="339" font-size="15" font-weight="700" fill="#0b0d19" text-anchor="middle">3</text>
  <circle cx="880" cy="418" r="12" fill="#f0b429"/>
  <text x="880" y="423" font-size="15" font-weight="700" fill="#0b0d19" text-anchor="middle">4</text>
  <circle cx="600" cy="418" r="12" fill="#f0b429"/>
  <text x="600" y="423" font-size="15" font-weight="700" fill="#0b0d19" text-anchor="middle">4</text>
  <circle cx="320" cy="418" r="12" fill="#f0b429"/>
  <text x="320" y="423" font-size="15" font-weight="700" fill="#0b0d19" text-anchor="middle">7</text>

  <!-- Row B -->
  <rect x="360" y="510" width="200" height="90" rx="14" fill="#11142a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="460" y="542" font-size="15" fill="#9ba3c4" text-anchor="middle">generation/</text>
  <text x="460" y="566" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">prompts.py</text>
  <text x="460" y="590" font-size="15" fill="#9ba3c4" text-anchor="middle">fills {context}</text>

  <rect x="640" y="510" width="200" height="90" rx="14" fill="#11142a" stroke="#ff3ddc" stroke-width="1.5"/>
  <text x="740" y="542" font-size="15" fill="#9ba3c4" text-anchor="middle">generation/</text>
  <text x="740" y="566" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">llm.py</text>
  <text x="740" y="590" font-size="15" fill="#9ba3c4" text-anchor="middle">model.invoke()</text>

  <rect x="920" y="510" width="200" height="90" rx="14" fill="#11142a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1020" y="542" font-size="15" fill="#9ba3c4" text-anchor="middle">indexing/</text>
  <text x="1020" y="566" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">embeddings.py</text>
  <text x="1020" y="590" font-size="15" fill="#9ba3c4" text-anchor="middle">embed_query(q)</text>

  <!-- vertical links -->
  <line x1="1000" y1="420" x2="1000" y2="510" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="1040" y1="510" x2="1040" y2="420" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="986" y="470" font-size="15" fill="#9ba3c4" text-anchor="end">question to vector</text>

  <line x1="430" y1="420" x2="430" y2="510" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <circle cx="450" cy="465" r="12" fill="#f0b429"/>
  <text x="450" y="470" font-size="15" font-weight="700" fill="#0b0d19" text-anchor="middle">5</text>

  <line x1="560" y1="555" x2="640" y2="555" stroke="#ff3ddc" stroke-width="2" marker-end="url(#arrow-pink)"/>
  <circle cx="600" cy="535" r="12" fill="#f0b429"/>
  <text x="600" y="540" font-size="15" font-weight="700" fill="#0b0d19" text-anchor="middle">6</text>

  <path d="M770,510 V465 H510 V420" fill="none" stroke="#ff3ddc" stroke-width="2" marker-end="url(#arrow-pink)"/>
  <text x="640" y="458" font-size="15" fill="#9ba3c4" text-anchor="middle">AIMessage back to the chain</text>

  <!-- Steps -->
  <text x="80" y="656" font-size="15" fill="#9ba3c4">1  POST /ask with a question. main.py validates it and calls the chain built in chain.py.</text>
  <text x="80" y="682" font-size="15" fill="#9ba3c4">2  chain.py passes the raw question to the retriever (a Runnable built from the vector store).</text>
  <text x="80" y="708" font-size="15" fill="#9ba3c4">3  retriever.py asks Chroma; Chroma embeds the question with the same model used at ingest time.</text>
  <text x="80" y="734" font-size="15" fill="#9ba3c4">4  The k nearest chunks come back as Document objects, each carrying source and title metadata.</text>
  <text x="80" y="760" font-size="15" fill="#9ba3c4">5  format_docs() numbers them [1]..[k]; prompts.py drops them into {context} next to {question}.</text>
  <text x="80" y="786" font-size="15" fill="#9ba3c4">6  llm.py sends the messages to the chat model; the AIMessage comes back and is parsed to text.</text>
  <text x="80" y="812" font-size="15" fill="#9ba3c4">7  chain.py returns answer plus sources; main.py serialises both as JSON.</text>

  <!-- Legend -->
  <rect x="80" y="842" width="18" height="18" rx="4" fill="#11142a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="106" y="856" font-size="15" fill="#9ba3c4">retrieval and indexing</text>
  <rect x="300" y="842" width="18" height="18" rx="4" fill="#11142a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="326" y="856" font-size="15" fill="#9ba3c4">chain and prompts</text>
  <rect x="490" y="842" width="18" height="18" rx="4" fill="#11142a" stroke="#ff3ddc" stroke-width="1.5"/>
  <text x="516" y="856" font-size="15" fill="#9ba3c4">LLM call</text>
  <rect x="620" y="842" width="18" height="18" rx="4" fill="#11142a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="646" y="856" font-size="15" fill="#9ba3c4">HTTP boundary</text>
  <circle cx="789" cy="851" r="9" fill="#f0b429"/>
  <text x="806" y="856" font-size="15" fill="#9ba3c4">step number</text>
</svg>
