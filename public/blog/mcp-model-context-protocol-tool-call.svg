<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff3ddc"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0b429"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="900" rx="24" fill="#0b0d19"/>

  <!-- Phase bands -->
  <rect x="20" y="118" width="1160" height="152" rx="12" fill="#11142a" fill-opacity="0.6"/>
  <rect x="20" y="285" width="1160" height="460" rx="12" fill="#11142a" fill-opacity="0.6"/>
  <rect x="20" y="760" width="1160" height="92" rx="12" fill="#11142a" fill-opacity="0.6"/>

  <!-- Lifelines -->
  <g stroke="#3a3f5e" stroke-width="1.5" stroke-dasharray="5 6">
    <line x1="100" y1="100" x2="100" y2="860"/>
    <line x1="330" y1="100" x2="330" y2="860"/>
    <line x1="600" y1="100" x2="600" y2="860"/>
    <line x1="870" y1="100" x2="870" y2="860"/>
    <line x1="1110" y1="100" x2="1110" y2="860"/>
  </g>

  <!-- Band labels (background rect hides the lifeline behind the text) -->
  <rect x="30" y="124" width="330" height="22" rx="6" fill="#0b0d19"/>
  <text x="36" y="140" fill="#9ba3c4" font-size="15">Discovery: once per server, result is cacheable</text>
  <rect x="30" y="291" width="330" height="22" rx="6" fill="#0b0d19"/>
  <text x="36" y="307" fill="#9ba3c4" font-size="15">One tool call, end to end</text>
  <rect x="30" y="766" width="330" height="22" rx="6" fill="#0b0d19"/>
  <text x="36" y="782" fill="#9ba3c4" font-size="15">Change notifications (opt-in stream)</text>

  <!-- Headers -->
  <rect x="15" y="40" width="170" height="60" rx="10" fill="#11142a" stroke="#f0b429" stroke-width="1.5"/>
  <text x="100" y="66" text-anchor="middle" fill="#eef1ff" font-size="18">User</text>
  <text x="100" y="88" text-anchor="middle" fill="#9ba3c4" font-size="15">customer</text>

  <rect x="245" y="40" width="170" height="60" rx="10" fill="#11142a" stroke="#ff3ddc" stroke-width="1.5"/>
  <text x="330" y="66" text-anchor="middle" fill="#eef1ff" font-size="18">LLM</text>
  <text x="330" y="88" text-anchor="middle" fill="#9ba3c4" font-size="15">decides, never calls</text>

  <rect x="515" y="40" width="170" height="60" rx="10" fill="#11142a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="66" text-anchor="middle" fill="#eef1ff" font-size="18">Host + Client</text>
  <text x="600" y="88" text-anchor="middle" fill="#9ba3c4" font-size="15">agent app, consent UI</text>

  <rect x="785" y="40" width="170" height="60" rx="10" fill="#11142a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="870" y="66" text-anchor="middle" fill="#eef1ff" font-size="18">MCP Server</text>
  <text x="870" y="88" text-anchor="middle" fill="#9ba3c4" font-size="15">orders</text>

  <rect x="1025" y="40" width="170" height="60" rx="10" fill="#11142a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="1110" y="66" text-anchor="middle" fill="#eef1ff" font-size="18">Orders API</text>
  <text x="1110" y="88" text-anchor="middle" fill="#9ba3c4" font-size="15">REST, API key</text>

  <!-- Discovery -->
  <line x1="600" y1="160" x2="870" y2="160" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="735" y="153" text-anchor="middle" fill="#eef1ff" font-size="15">1. server/discover (optional)</text>
  <line x1="870" y1="192" x2="600" y2="192" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-violet)"/>
  <text x="735" y="185" text-anchor="middle" fill="#9ba3c4" font-size="15">versions + capabilities</text>
  <line x1="600" y1="228" x2="870" y2="228" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="735" y="221" text-anchor="middle" fill="#eef1ff" font-size="15">2. tools/list</text>
  <line x1="870" y1="258" x2="600" y2="258" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-violet)"/>
  <text x="735" y="251" text-anchor="middle" fill="#9ba3c4" font-size="15">tool list: name, desc, schema</text>

  <!-- One tool call -->
  <line x1="100" y1="335" x2="600" y2="335" stroke="#f0b429" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="350" y="328" text-anchor="middle" fill="#eef1ff" font-size="15">3. "Where is my order #4821?"</text>

  <line x1="600" y1="370" x2="330" y2="370" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="465" y="363" text-anchor="middle" fill="#eef1ff" font-size="15">4. prompt + tool definitions</text>

  <line x1="330" y1="408" x2="600" y2="408" stroke="#ff3ddc" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
  <text x="465" y="401" text-anchor="middle" fill="#eef1ff" font-size="15">5. tool_use lookup_order(4821)</text>

  <line x1="600" y1="446" x2="100" y2="446" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="350" y="439" text-anchor="middle" fill="#eef1ff" font-size="15">6. Allow lookup_order? (consent)</text>
  <line x1="100" y1="476" x2="600" y2="476" stroke="#f0b429" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-amber)"/>
  <text x="350" y="469" text-anchor="middle" fill="#9ba3c4" font-size="15">approve</text>

  <line x1="600" y1="516" x2="870" y2="516" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="735" y="509" text-anchor="middle" fill="#eef1ff" font-size="15">7. tools/call lookup_order</text>

  <line x1="870" y1="554" x2="1110" y2="554" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="990" y="547" text-anchor="middle" fill="#eef1ff" font-size="15">8. GET /orders/4821</text>
  <line x1="1110" y1="584" x2="870" y2="584" stroke="#4ade80" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>
  <text x="990" y="577" text-anchor="middle" fill="#9ba3c4" font-size="15">200 OK + JSON</text>

  <line x1="870" y1="624" x2="600" y2="624" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-violet)"/>
  <text x="735" y="617" text-anchor="middle" fill="#eef1ff" font-size="15">9. result: content + structured</text>

  <line x1="600" y1="662" x2="330" y2="662" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="465" y="655" text-anchor="middle" fill="#eef1ff" font-size="15">10. tool_result</text>

  <line x1="330" y1="698" x2="600" y2="698" stroke="#ff3ddc" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
  <text x="465" y="691" text-anchor="middle" fill="#eef1ff" font-size="15">11. final answer text</text>

  <line x1="600" y1="732" x2="100" y2="732" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="350" y="725" text-anchor="middle" fill="#eef1ff" font-size="15">12. "Order #4821 ships on Oct 30"</text>

  <!-- Notifications -->
  <line x1="600" y1="805" x2="870" y2="805" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="735" y="798" text-anchor="middle" fill="#eef1ff" font-size="15">subscriptions/listen (tools)</text>
  <line x1="870" y1="840" x2="600" y2="840" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-violet)"/>
  <text x="735" y="833" text-anchor="middle" fill="#9ba3c4" font-size="15">notifications/tools/list_changed</text>

  <!-- Legend -->
  <g font-size="15" fill="#9ba3c4">
    <line x1="60" y1="880" x2="100" y2="880" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="108" y="885">request / message</text>
    <line x1="270" y1="880" x2="310" y2="880" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="318" y="885">response</text>
    <text x="430" y="885">Colour = who sends: amber user, pink LLM, cyan host, violet server, green API</text>
  </g>
</svg>
