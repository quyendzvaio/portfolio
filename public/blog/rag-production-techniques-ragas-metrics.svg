<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="m-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="m-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0b429"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="520" rx="24" fill="#0b0d19"/>

  <text x="40" y="44" font-size="22" font-weight="600" fill="#eef1ff">What RAGAS metrics actually compare</text>
  <text x="40" y="72" font-size="15" fill="#9ba3c4">A RAG call produces four things. Each metric is a question about two of them.</text>

  <!-- legend -->
  <circle cx="862" cy="39" r="6" fill="#22d3ee"/>
  <text x="874" y="44" font-size="15" fill="#9ba3c4">reference-free</text>
  <circle cx="1010" cy="39" r="6" fill="#f0b429"/>
  <text x="1022" y="44" font-size="15" fill="#9ba3c4">needs reference</text>

  <!-- nodes -->
  <g stroke="#eef1ff" stroke-width="1.5" fill="#11142a">
    <rect x="80" y="110" width="260" height="80" rx="12"/>
    <rect x="860" y="110" width="260" height="80" rx="12"/>
    <rect x="80" y="370" width="260" height="80" rx="12"/>
    <rect x="860" y="370" width="260" height="80" rx="12"/>
  </g>
  <g font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">
    <text x="210" y="143">Question</text>
    <text x="990" y="143">Retrieved context</text>
    <text x="210" y="403">Answer</text>
    <text x="990" y="403">Reference</text>
  </g>
  <g font-size="15" fill="#9ba3c4" text-anchor="middle">
    <text x="210" y="168">user_input</text>
    <text x="990" y="168">retrieved_contexts</text>
    <text x="210" y="428">response</text>
    <text x="990" y="428">reference (golden answer)</text>
  </g>

  <!-- Question - Answer : response relevancy -->
  <line x1="210" y1="190" x2="210" y2="370" stroke="#22d3ee" stroke-width="1.5"/>
  <rect x="100" y="262" width="220" height="36" rx="18" fill="#0b0d19" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="210" y="286" font-size="16" fill="#eef1ff" text-anchor="middle">Response relevancy</text>

  <!-- Context -> Answer : faithfulness -->
  <line x1="900" y1="190" x2="300" y2="370" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#m-cyan)"/>
  <rect x="520" y="262" width="160" height="36" rx="18" fill="#0b0d19" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="600" y="286" font-size="16" fill="#eef1ff" text-anchor="middle">Faithfulness</text>

  <!-- Context - Reference : context recall / precision -->
  <line x1="990" y1="190" x2="990" y2="370" stroke="#f0b429" stroke-width="1.5"/>
  <rect x="870" y="250" width="240" height="60" rx="18" fill="#0b0d19" stroke="#f0b429" stroke-width="1.5"/>
  <text x="990" y="274" font-size="16" fill="#eef1ff" text-anchor="middle">Context recall</text>
  <text x="990" y="296" font-size="16" fill="#eef1ff" text-anchor="middle">Context precision</text>

  <!-- Answer - Reference : factual correctness -->
  <line x1="340" y1="410" x2="860" y2="410" stroke="#f0b429" stroke-width="1.5"/>
  <rect x="490" y="392" width="220" height="36" rx="18" fill="#0b0d19" stroke="#f0b429" stroke-width="1.5"/>
  <text x="600" y="416" font-size="16" fill="#eef1ff" text-anchor="middle">Factual correctness</text>

  <!-- side notes -->
  <text x="360" y="150" font-size="15" fill="#9ba3c4">reference-free: judge reads only what the system produced</text>
  <text x="360" y="172" font-size="15" fill="#9ba3c4">needs reference: a golden answer must exist</text>

  <text x="600" y="484" font-size="15" fill="#9ba3c4" text-anchor="middle">Noise sensitivity uses all four: how many answer claims are wrong when the context was relevant, or when it was noise.</text>
</svg>
