<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff3ddc"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4ade80"/>
    </marker>
  </defs>

  <rect width="1200" height="800" rx="24" fill="#0b0d19"/>

  <text x="600" y="50" font-size="24" font-weight="700" fill="#eef1ff" text-anchor="middle">LangChain components snapped into a RAG chain</text>

  <!-- Lane 1: indexing -->
  <text x="80" y="100" font-size="16" font-weight="600" fill="#22d3ee" letter-spacing="1">INDEXING  (offline, run once per content change)</text>

  <rect x="80" y="118" width="200" height="84" rx="14" fill="#11142a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="180" y="156" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">Document loaders</text>
  <text x="180" y="182" font-size="15" fill="#9ba3c4" text-anchor="middle">files to Document</text>

  <rect x="360" y="118" width="200" height="84" rx="14" fill="#11142a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="460" y="156" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">Text splitters</text>
  <text x="460" y="182" font-size="15" fill="#9ba3c4" text-anchor="middle">Document to chunks</text>

  <rect x="640" y="118" width="200" height="84" rx="14" fill="#11142a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="740" y="156" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">Embeddings</text>
  <text x="740" y="182" font-size="15" fill="#9ba3c4" text-anchor="middle">text to vectors</text>

  <rect x="920" y="118" width="200" height="84" rx="14" fill="#11142a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1020" y="156" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">Vector store</text>
  <text x="1020" y="182" font-size="15" fill="#9ba3c4" text-anchor="middle">store and search</text>

  <line x1="280" y1="160" x2="360" y2="160" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="560" y1="160" x2="640" y2="160" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <line x1="840" y1="160" x2="920" y2="160" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- Vector store feeds the retriever -->
  <path d="M1020,202 V276 H309 V350" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="664" y="268" font-size="15" fill="#9ba3c4" text-anchor="middle">vector_store.as_retriever()</text>

  <!-- Lane 2: query chain -->
  <text x="27" y="330" font-size="16" font-weight="600" fill="#a78bfa" letter-spacing="1">QUERY  (online, every question)   LCEL:  retriever | prompt | model | parser</text>

  <rect x="27" y="350" width="176" height="84" rx="14" fill="#11142a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="115" y="388" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">Question</text>
  <text x="115" y="414" font-size="15" fill="#9ba3c4" text-anchor="middle">user text</text>

  <rect x="221" y="350" width="176" height="84" rx="14" fill="#11142a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="309" y="388" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">Retriever</text>
  <text x="309" y="414" font-size="15" fill="#9ba3c4" text-anchor="middle">query to top-k docs</text>

  <rect x="415" y="350" width="176" height="84" rx="14" fill="#11142a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="503" y="388" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">Prompt template</text>
  <text x="503" y="414" font-size="15" fill="#9ba3c4" text-anchor="middle">fills {context}</text>

  <rect x="609" y="350" width="176" height="84" rx="14" fill="#11142a" stroke="#ff3ddc" stroke-width="1.5"/>
  <text x="697" y="388" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">Chat model</text>
  <text x="697" y="414" font-size="15" fill="#9ba3c4" text-anchor="middle">init_chat_model</text>

  <rect x="803" y="350" width="176" height="84" rx="14" fill="#11142a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="891" y="388" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">Output parser</text>
  <text x="891" y="414" font-size="15" fill="#9ba3c4" text-anchor="middle">str or structured</text>

  <rect x="997" y="350" width="176" height="84" rx="14" fill="#11142a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1085" y="388" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">Answer</text>
  <text x="1085" y="414" font-size="15" fill="#9ba3c4" text-anchor="middle">with [1] citations</text>

  <line x1="203" y1="392" x2="221" y2="392" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <line x1="397" y1="392" x2="415" y2="392" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <line x1="591" y1="392" x2="609" y2="392" stroke="#ff3ddc" stroke-width="2" marker-end="url(#arrow-pink)"/>
  <line x1="785" y1="392" x2="803" y2="392" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <line x1="979" y1="392" x2="997" y2="392" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow-violet)"/>

  <!-- Agent variant -->
  <line x1="309" y1="434" x2="309" y2="530" stroke="#4ade80" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="322" y="490" font-size="15" fill="#9ba3c4">same retriever, wrapped in @tool</text>

  <rect x="27" y="530" width="1146" height="84" rx="14" fill="#11142a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="600" y="566" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">Agent variant: hand the tool to create_agent(); the model decides when to retrieve</text>
  <text x="600" y="594" font-size="15" fill="#9ba3c4" text-anchor="middle">the loop runs on LangGraph; a checkpointer keeps chat history per thread_id</text>

  <!-- Tracing band -->
  <rect x="27" y="650" width="1146" height="60" rx="14" fill="#11142a" stroke="#f0b429" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="600" y="686" font-size="18" font-weight="600" fill="#eef1ff" text-anchor="middle">LangSmith tracing: LANGSMITH_TRACING=true turns every call above into a trace span</text>

  <!-- Legend -->
  <rect x="80" y="752" width="18" height="18" rx="4" fill="#11142a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="106" y="766" font-size="15" fill="#9ba3c4">indexing</text>
  <rect x="200" y="752" width="18" height="18" rx="4" fill="#11142a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="226" y="766" font-size="15" fill="#9ba3c4">query chain (Runnables)</text>
  <rect x="430" y="752" width="18" height="18" rx="4" fill="#11142a" stroke="#ff3ddc" stroke-width="1.5"/>
  <text x="456" y="766" font-size="15" fill="#9ba3c4">LLM call</text>
  <rect x="550" y="752" width="18" height="18" rx="4" fill="#11142a" stroke="#4ade80" stroke-width="1.5"/>
  <text x="576" y="766" font-size="15" fill="#9ba3c4">agent loop</text>
  <rect x="690" y="752" width="18" height="18" rx="4" fill="#11142a" stroke="#f0b429" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="716" y="766" font-size="15" fill="#9ba3c4">observability</text>
</svg>
