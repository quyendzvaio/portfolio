<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="620" rx="24" fill="#0b0d19"/>

  <!-- Titles -->
  <text x="300" y="52" text-anchor="middle" fill="#eef1ff" font-size="22" font-weight="600">Before MCP: N apps x M tools</text>
  <text x="300" y="78" text-anchor="middle" fill="#9ba3c4" font-size="15">every app writes its own adapter for every tool</text>
  <text x="900" y="52" text-anchor="middle" fill="#eef1ff" font-size="22" font-weight="600">With MCP: N clients + M servers</text>
  <text x="900" y="78" text-anchor="middle" fill="#9ba3c4" font-size="15">one protocol in the middle, each side written once</text>

  <line x1="600" y1="95" x2="600" y2="590" stroke="#2a2f4a" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- LEFT: apps -->
  <g stroke="#22d3ee" stroke-width="1.5" fill="#11142a">
    <rect x="60" y="130" width="200" height="56" rx="10"/>
    <rect x="60" y="260" width="200" height="56" rx="10"/>
    <rect x="60" y="390" width="200" height="56" rx="10"/>
  </g>
  <g fill="#eef1ff" font-size="18" text-anchor="middle">
    <text x="160" y="164">Chat app</text>
    <text x="160" y="294">IDE agent</text>
    <text x="160" y="424">Support agent</text>
  </g>

  <!-- LEFT: tools -->
  <g stroke="#f0b429" stroke-width="1.5" fill="#11142a">
    <rect x="340" y="110" width="200" height="56" rx="10"/>
    <rect x="340" y="220" width="200" height="56" rx="10"/>
    <rect x="340" y="330" width="200" height="56" rx="10"/>
    <rect x="340" y="440" width="200" height="56" rx="10"/>
  </g>
  <g fill="#eef1ff" font-size="18" text-anchor="middle">
    <text x="440" y="144">Orders API</text>
    <text x="440" y="254">Refund API</text>
    <text x="440" y="364">CRM tickets</text>
    <text x="440" y="474">Email API</text>
  </g>

  <!-- LEFT: 3 x 4 = 12 custom adapters -->
  <g stroke="#ff3ddc" stroke-width="1.5" stroke-opacity="0.75">
    <line x1="260" y1="158" x2="340" y2="138"/>
    <line x1="260" y1="158" x2="340" y2="248"/>
    <line x1="260" y1="158" x2="340" y2="358"/>
    <line x1="260" y1="158" x2="340" y2="468"/>
    <line x1="260" y1="288" x2="340" y2="138"/>
    <line x1="260" y1="288" x2="340" y2="248"/>
    <line x1="260" y1="288" x2="340" y2="358"/>
    <line x1="260" y1="288" x2="340" y2="468"/>
    <line x1="260" y1="418" x2="340" y2="138"/>
    <line x1="260" y1="418" x2="340" y2="248"/>
    <line x1="260" y1="418" x2="340" y2="358"/>
    <line x1="260" y1="418" x2="340" y2="468"/>
  </g>
  <text x="300" y="540" text-anchor="middle" fill="#ff3ddc" font-size="16" font-weight="600">12 custom adapters</text>
  <text x="300" y="564" text-anchor="middle" fill="#9ba3c4" font-size="15">12 auth schemes, 12 payload shapes, 12 docs to read</text>

  <!-- RIGHT: hosts -->
  <g stroke="#22d3ee" stroke-width="1.5" fill="#11142a">
    <rect x="640" y="130" width="190" height="56" rx="10"/>
    <rect x="640" y="260" width="190" height="56" rx="10"/>
    <rect x="640" y="390" width="190" height="56" rx="10"/>
  </g>
  <g fill="#eef1ff" font-size="18" text-anchor="middle">
    <text x="735" y="164">Chat app</text>
    <text x="735" y="294">IDE agent</text>
    <text x="735" y="424">Support agent</text>
  </g>
  <text x="735" y="112" text-anchor="middle" fill="#9ba3c4" font-size="15">each runs an MCP client</text>

  <!-- RIGHT: the protocol bar -->
  <rect x="880" y="100" width="60" height="420" rx="12" fill="#11142a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="910" y="310" text-anchor="middle" fill="#a78bfa" font-size="20" font-weight="600" transform="rotate(-90 910 310)">MCP (JSON-RPC 2.0)</text>

  <!-- RIGHT: servers -->
  <g stroke="#a78bfa" stroke-width="1.5" fill="#11142a">
    <rect x="980" y="110" width="170" height="56" rx="10"/>
    <rect x="980" y="220" width="170" height="56" rx="10"/>
    <rect x="980" y="330" width="170" height="56" rx="10"/>
    <rect x="980" y="440" width="170" height="56" rx="10"/>
  </g>
  <g fill="#eef1ff" font-size="18" text-anchor="middle">
    <text x="1065" y="144">Orders server</text>
    <text x="1065" y="254">Refund server</text>
    <text x="1065" y="364">CRM server</text>
    <text x="1065" y="474">Email server</text>
  </g>

  <!-- RIGHT: hosts -> MCP -->
  <g stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)">
    <line x1="830" y1="158" x2="880" y2="158"/>
    <line x1="830" y1="288" x2="880" y2="288"/>
    <line x1="830" y1="418" x2="880" y2="418"/>
  </g>
  <!-- RIGHT: MCP -> servers -->
  <g stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)">
    <line x1="940" y1="138" x2="980" y2="138"/>
    <line x1="940" y1="248" x2="980" y2="248"/>
    <line x1="940" y1="358" x2="980" y2="358"/>
    <line x1="940" y1="468" x2="980" y2="468"/>
  </g>

  <text x="900" y="540" text-anchor="middle" fill="#4ade80" font-size="16" font-weight="600">3 clients + 4 servers = 7 pieces</text>
  <text x="900" y="564" text-anchor="middle" fill="#9ba3c4" font-size="15">a new tool is one new server; a new app is one new client</text>

  <!-- Legend -->
  <g font-size="15" fill="#9ba3c4">
    <rect x="330" y="588" width="14" height="14" rx="3" fill="#11142a" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="352" y="600">AI application (host)</text>
    <rect x="520" y="588" width="14" height="14" rx="3" fill="#11142a" stroke="#f0b429" stroke-width="1.5"/>
    <text x="542" y="600">Raw API</text>
    <rect x="640" y="588" width="14" height="14" rx="3" fill="#11142a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="662" y="600">MCP server / protocol</text>
    <line x1="840" y1="595" x2="870" y2="595" stroke="#ff3ddc" stroke-width="1.5"/>
    <text x="878" y="600">Custom glue code</text>
  </g>
</svg>
