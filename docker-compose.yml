# Backend only: comments, admin login and the chat call.
#
#   cp .env.server.example .env.server   # then fill it in
#   docker compose up -d
#
# The backend reads everything from .env.server.
#
# There is no MinIO service any more. Comments and the avatar live in Vercel Blob,
# which is the same store the deployed site writes to, so local dev needs a token
# (BLOB_READ_WRITE_TOKEN) rather than a container, a volume and a second set of
# credentials to keep in sync.
services:
  backend:
    build: .
    env_file: .env.server
    environment:
      # Set to "1" only when a reverse proxy you control is the only way in.
      TRUST_PROXY: "1"
    ports:
      - "8787:8787"
    restart: unless-stopped

  # Optional TLS terminator for a VPS deployment. On Vercel this is unnecessary —
  # the platform terminates TLS for you. Start it with:
  #   docker compose --profile tls up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    env_file: .env.server
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
